# SPDX-License-Identifier: Apache-2.0
# Builds the Python runner images of aik test (spec 08.7 and 08.9), tests them on the content repository, and pushes them to ghcr.io with build provenance. Only a push to main publishes.
# tamnd/ai has only Python code: plain Python, NumPy, PyTorch and JAX. The other directories of images/ stay for a later framework of tier 2 or 3.
name: Images

on:
  push:
    branches: [main]
    paths: [images/**, lang/**, .github/workflows/images.yml]
  pull_request:
    paths: [images/**, lang/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [python, numpy, pytorch, jax]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ matrix.image }}
      REF: ghcr.io/tamnd/aik-runner-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/ai
          path: content
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the image
        run: |
          docker build --pull --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$REF:latest" "images/$IMAGE"
          echo "ID=$(docker image inspect --format '{{.Id}}' "$REF:latest")" >> "$GITHUB_ENV"
      - name: Show the packages
        run: docker run --rm --network none "$ID" python -m pip list --format freeze
      - name: Import the framework with no network
        if: matrix.image != 'python'
        run: |
          case "$IMAGE" in
            numpy) mod=numpy ;;
            pytorch) mod=torch ;;
            jax) mod=jax ;;
          esac
          docker run --rm --network none --read-only --tmpfs /tmp "$ID" python -c "import $mod, sys; print($mod.__name__, $mod.__version__, sys.version.split()[0])"
      - name: Test that a socket fails in the sandbox
        env:
          AIK_TEST_PYTHON_IMAGE: ${{ env.ID }}
        run: go test ./lang -run TestSandboxNoNetwork -v
      - name: Run the tests of the content repository in the image
        run: |
          go build -o "$RUNNER_TEMP/aik" ./cmd/aik
          echo "$IMAGE: $ID" > "$RUNNER_TEMP/images.yaml"
          "$RUNNER_TEMP/aik" test -root content -sandbox docker -images "$RUNNER_TEMP/images.yaml" -lang "$IMAGE" -out "$RUNNER_TEMP/results"
      - name: Push the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$REF:latest" "$REF:$GITHUB_SHA"
          docker push "$REF:latest"
          docker push "$REF:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REF:latest")
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
          echo "$REF@${digest#*@}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ env.REF }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
